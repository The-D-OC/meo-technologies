name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stages:
        description: 'Traffic stages, in percent (e.g. "10 50 100", or "100" to ship at once)'
        default: '10 50 100'
      wait:
        description: 'Seconds to hold at each stage'
        default: '180'

# Never run two production rollouts at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload preview version (no production traffic)
        id: upload
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          OUT="$(mktemp)"
          WRANGLER_OUTPUT_FILE_PATH="$OUT" npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.number }}" \
            --message "$(echo "PR #${{ github.event.number }}: $PR_TITLE" | cut -c1-100)" \
            --tag "pr-${{ github.event.number }}"
          URL="$(jq -r 'select(.type=="version-upload") | .preview_alias_url // .preview_url // empty' "$OUT" | tail -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview link
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🚀 Preview for this PR: ${{ steps.upload.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.startsWith('🚀 Preview for this PR'));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  production:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Rolling deploy
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          ROLLOUT_STAGES: ${{ inputs.stages || vars.ROLLOUT_STAGES || '10 50 100' }}
          ROLLOUT_WAIT: ${{ inputs.wait || vars.ROLLOUT_WAIT || '180' }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message || 'Manual deploy' }}
        run: bash scripts/rollout.sh
